name: YamlLint
on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
jobs:
  lint:
    name: YamlLint
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
      - name: YamlLint
        run: |
          pip install yamllint
          yamllint .
