name: GoLic
# Verify every source file carries the MIT license header. `golic inject -x -d`
# is a dry run that fails the check if a header is missing; it never modifies
# files. This calls golic directly rather than through `task license`, because
# this repo's `license` task injects headers (it is not the dry-run check).
# Docs (**.md) carry no header, so golic's .golic.yaml leaves them out.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  golic:
    name: 🔏 License headers
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOLIC_VERSION: v0.2.0
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'
      - name: Verify MIT headers
        run: |
          # Assign first, then export, so a failing `go env` is not masked.
          gobin="$(go env GOPATH)/bin"
          export PATH="${PATH}:${gobin}"
          go install "github.com/Bugs5382/golic/cmd/golic@${GOLIC_VERSION}"
          golic inject -t mit -c "2026 Shane" -x -d
